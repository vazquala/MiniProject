<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Guestbook</title>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <link rel="stylesheet" href="../../styles/styles6.css">
    </head>
    <body>
        <h1>Guestbook</h1>

        <form id="guest-form">
            <input type="text" id="name-input" placeholder="Your name" required>
            <textarea id="msg-input" placeholder="Your message" required></textarea>
            <button type="submit">Sign Guestbook</button>
        </form>

        <div id="entries"></div>

        <script src="script.js"></script>
    </body>
</html>
