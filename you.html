<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Guestbook</title>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <link rel="stylesheet" href="../../styles/styles6.css">
    </head>
    <body>
        <header>
            <h1>Favorites Page</h1>
        </header>

        <nav class="flex-box">
            <a href="website/index.html">Home</a>
        </nav>

        <main>
            <h2 class="introduction">Favorites Page</h2>
            <p class="introduction">
                If you want to help out by sharing your favorite animated movie, put your user along with your
                movie pick down below.
            </p>

            <hr>

            <h2>Table</h2>

            <form id="guest-form">
                <input type="text" id="name-input" placeholder="Your user" required>
                <input id="msg-input" placeholder="Your movie pick" required>
                <button type="submit">Submit</button>
            </form>


            <section>
                <div id="entries"></div>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
